name: Gate 0 Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate0-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Gate 0 integrity check
        run: python3 tests/gate0_integrity.py

      - name: Check Git whitespace
        run: git diff --check
