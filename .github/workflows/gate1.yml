name: Gate 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidan
          POSTGRES_PASSWORD: aidan
          POSTGRES_DB: aidan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aidan:aidan@localhost:5432/aidan_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package (with test extras)
        run: pip install "./packages/core[test]"

      - name: Apply migrations (bootstrap)
        run: python -m aidan_core.migrate

      - name: Run tests
        run: pytest -v

      - name: Check Git whitespace
        run: git diff --check

  # Independent artifact-level proof: the normal `gate1` job source-shadows the
  # wheel (tests/conftest.py injects packages/core onto sys.path), so its green
  # result does NOT prove the built/installed artifact is complete. This job builds
  # the wheel, installs it into a clean venv, and imports the representative runtime
  # packages from a neutral directory — failing if any aidan_core[.*] package is
  # omitted from the installed artifact. It needs no database.
  packaging-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify installed-wheel completeness (no source shadowing)
        run: python packages/core/tools/verify_wheel_packaging.py packages/core
