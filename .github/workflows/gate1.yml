name: Gate 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidan
          POSTGRES_PASSWORD: aidan
          POSTGRES_DB: aidan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aidan:aidan@localhost:5432/aidan_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bubblewrap enables the deterministic coding-verification sandbox tests to
      # actually execute (they skip without it). See the sandbox-contract job.
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install package (with test extras)
        run: pip install "./packages/core[test]"

      - name: Apply migrations (bootstrap)
        run: python -m aidan_core.migrate

      - name: Run tests
        run: pytest -v

      - name: Check Git whitespace
        run: git diff --check

  # Independent artifact-level proof: the normal `gate1` job source-shadows the
  # wheel (tests/conftest.py injects packages/core onto sys.path), so its green
  # result does NOT prove the built/installed artifact is complete. This job builds
  # the wheel, installs it into a clean venv, and imports the representative runtime
  # packages from a neutral directory — failing if any aidan_core[.*] package is
  # omitted from the installed artifact. It needs no database.
  packaging-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify installed-wheel completeness (no source shadowing)
        run: python packages/core/tools/verify_wheel_packaging.py packages/core

  # Load-bearing installed-RUNTIME proof: package imports are not enough — the
  # installed artifact must perform real runtime operations with no checkout / cwd
  # dependence. From a clean wheel installed into a fresh venv, run from a neutral
  # directory, this proves: migrations 0001-0025 discover from packaged resources
  # AND apply against a real PostgreSQL; and the canonical OS repository is rejected
  # as a venture workspace via installation-independent trusted identity. Cannot be
  # satisfied by source shadowing.
  installed-runtime:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidan
          POSTGRES_PASSWORD: aidan
          POSTGRES_DB: aidan_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aidan:aidan@localhost:5432/aidan_runtime_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify installed runtime (migrations apply + OS-repo isolation + sandbox verify, clean wheel)
        run: python packages/core/tools/verify_installed_runtime.py packages/core "$GITHUB_WORKSPACE" --require-db

  # Bubblewrap sandbox CONTRACT proof (Gate 8 deterministic coding verification):
  # experimentally proves the narrow bwrap profile actually contains untrusted
  # candidate code — no network, no canonical-repo write, no host secrets/home,
  # isolated writable scratch, and timeout kills the process tree. Linux-only; the
  # sandbox is a sanctioned narrow OS-security primitive, not a generic platform.
  sandbox-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces for bwrap (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: bwrap diagnostics (non-fatal)
        run: |
          bwrap --version || true
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
          echo "apparmor_restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev --tmpfs /work --chdir /work /usr/bin/true && echo "SMOKE_OK" || echo "SMOKE_FAIL(exit=$?)"
        continue-on-error: true

      - name: Install package
        run: pip install "./packages/core"

      - name: Prove sandbox containment contract
        run: python packages/core/tools/verify_sandbox_contract.py "$GITHUB_WORKSPACE"

  # Codex CLI contract proof for the CodexExecWorker adapter: installs an actual codex
  # binary and verifies the exact command surface the adapter depends on really exists
  # (fail-closed on capability drift). NO authentication and NO `codex exec` model call —
  # only `codex --version` / `--help`. This is fast-moving CLI, so the check pins the
  # contract at CI time rather than trusting documentation alone.
  codex-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Codex CLI (0.151.0)
        run: npm install -g @openai/codex@0.151.0

      - name: Assert pinned Codex version
        run: |
          v="$(codex --version | head -1)"
          echo "codex version: $v"
          test "$v" = "codex-cli 0.151.0" || { echo "FAIL: expected codex-cli 0.151.0"; exit 1; }

      - name: Verify Codex CLI command-surface contract (no auth, no model call)
        run: python packages/core/tools/verify_codex_cli_contract.py

      - name: Falsify the EXACT production argv parses (no credential, no provider request)
        run: python packages/core/tools/verify_codex_argv.py
