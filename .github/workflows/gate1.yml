name: Gate 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate1:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidan
          POSTGRES_PASSWORD: aidan
          POSTGRES_DB: aidan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aidan:aidan@localhost:5432/aidan_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package (with test extras)
        run: pip install "./packages/core[test]"

      - name: Apply migrations (bootstrap)
        run: python -m aidan_core.migrate

      - name: Run tests
        run: pytest -v

      - name: Check Git whitespace
        run: git diff --check

  # Independent artifact-level proof: the normal `gate1` job source-shadows the
  # wheel (tests/conftest.py injects packages/core onto sys.path), so its green
  # result does NOT prove the built/installed artifact is complete. This job builds
  # the wheel, installs it into a clean venv, and imports the representative runtime
  # packages from a neutral directory — failing if any aidan_core[.*] package is
  # omitted from the installed artifact. It needs no database.
  packaging-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify installed-wheel completeness (no source shadowing)
        run: python packages/core/tools/verify_wheel_packaging.py packages/core

  # Load-bearing installed-RUNTIME proof: package imports are not enough — the
  # installed artifact must perform real runtime operations with no checkout / cwd
  # dependence. From a clean wheel installed into a fresh venv, run from a neutral
  # directory, this proves: migrations 0001-0025 discover from packaged resources
  # AND apply against a real PostgreSQL; and the canonical OS repository is rejected
  # as a venture workspace via installation-independent trusted identity. Cannot be
  # satisfied by source shadowing.
  installed-runtime:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidan
          POSTGRES_PASSWORD: aidan
          POSTGRES_DB: aidan_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aidan:aidan@localhost:5432/aidan_runtime_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify installed runtime (migrations apply + OS-repo isolation, clean wheel)
        run: python packages/core/tools/verify_installed_runtime.py packages/core "$GITHUB_WORKSPACE" --require-db

  # Bubblewrap sandbox CONTRACT proof (Gate 8 deterministic coding verification):
  # experimentally proves the narrow bwrap profile actually contains untrusted
  # candidate code — no network, no canonical-repo write, no host secrets/home,
  # isolated writable scratch, and timeout kills the process tree. Linux-only; the
  # sandbox is a sanctioned narrow OS-security primitive, not a generic platform.
  sandbox-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: bwrap version + unprivileged-userns capability
        run: |
          bwrap --version
          echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev --tmpfs /work --chdir /work /usr/bin/true && echo "bwrap smoke: OK"

      - name: Install package
        run: pip install "./packages/core"

      - name: Prove sandbox containment contract
        run: python packages/core/tools/verify_sandbox_contract.py "$GITHUB_WORKSPACE"
