name: Gate 8 Fly Live Deploy Smoke

# MANUAL ONLY. One authorized dispatch -> at most one real Fly machine create (max_attempts=1) plus
# ONE cleanup delete of that exact machine. No push / pull_request / schedule / workflow_run trigger,
# and NO retry. The smoke establishes its OWN complete bounded canonical fixture in a fresh ephemeral
# PostgreSQL (no foreign ActionRequest id), deploys the EXACT frozen OCI artifact its release
# authorizes to an owner-created venture-owned Fly app, reads the running digest back INDEPENDENTLY,
# records a VERIFIED DEPLOYMENT_RELEASE proof, then DELETES the machine and confirms absence. It does
# NOT promote to OPERATING (Stage C: the venture stays BUILDING). Spend bounded to USD 0.05. Ambiguous
# effects fail closed into RECOVERY_REQUIRED (never blind-retried); ambiguous cleanup is never a clean
# PASS. Sanitized evidence only — no credential, no raw provider response. NOT auto-dispatched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_FROZEN_FLY_DEPLOY_SMOKE to authorize the single bounded live deploy (<= USD 0.05)'
        required: true
        default: ''
      fly_app:
        description: 'The owner-created, venture-owned Fly app name (external infrastructure) to deploy into'
        required: true
        default: ''
      accepted_sha:
        description: 'Exact accepted main commit SHA to fail-close against (must equal the checked-out commit)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  fly-live-deploy-smoke:
    if: ${{ github.event.inputs.confirm == 'RUN_FROZEN_FLY_DEPLOY_SMOKE' }}
    runs-on: ubuntu-latest
    environment: gate8-fly-live-deploy

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidan
          POSTGRES_PASSWORD: aidan
          POSTGRES_DB: aidan_fly_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aidan:aidan@localhost:5432/aidan_fly_smoke
      CONFIRM: ${{ github.event.inputs.confirm }}
      AIDAN_OS_REPO_ROOT: ${{ github.workspace }}
      FLY_SMOKE_APP: ${{ github.event.inputs.fly_app }}
      FLY_SMOKE_ACCEPTED_SHA: ${{ github.event.inputs.accepted_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install "./packages/core"

      - name: Apply migrations
        run: python -m aidan_core.migrate

      - name: Run the frozen bounded live Fly deploy boundary smoke (one create + one cleanup)
        env:
          # Invocation-scoped, app-scoped Fly deploy token. Host-mapped into this step only; never
          # persisted in canonical state and never printed.
          DEPLOY_FLY_API_TOKEN: ${{ secrets.DEPLOY_FLY_API_TOKEN }}
        run: python -m aidan_core.deploy.fly_live_smoke
