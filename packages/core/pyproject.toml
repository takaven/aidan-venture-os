[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidan-core"
version = "0.1.0"
description = "AI-DAN Venture OS canonical truth & governance kernel (Gate 1, Slice 1 foundation)."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

# Discover the COMPLETE aidan_core package tree automatically. An explicit list
# silently omitted subpackages (factory/build/deploy/market) from the built wheel;
# discovery includes every intended aidan_core[.*] package and no test/unrelated
# content (tests live at the repo root, outside this project dir).
[tool.setuptools.packages.find]
where = ["."]
include = ["aidan_core*"]
namespaces = false
